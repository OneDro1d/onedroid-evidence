# The evidence site's checks (argus-claims docs/dark-factory/02-sa-service-map §5.3). The ruleset on main requires this
# check, so it runs on every pull request into main that is ready for review, with no path filter: a skipped run would
# never report and would leave its pull request unmergeable. Minutes are free on this public repo.
name: check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # I-5 compares with the base commit
      - name: Tests
        run: python3 -I -m unittest discover -s tools/tests
      - name: Invariants I-1 to I-9 (I-5 against main; publication rules on a claims/* branch)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          extra=""
          case "$HEAD_REF" in
            claims/*) extra="--publication" ;;
          esac
          python3 -I tools/build.py --check --base origin/main $extra
